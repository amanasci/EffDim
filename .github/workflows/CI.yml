name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # D-16: drop 3.9 — align with requires-python >=3.10 and abi3-py310
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # D-13: Rust + maturin develop then full pytest (incl. test_native_skeleton)
      # D-15: OS × Python matrix only — no Phase 5 maturin-action wheel publish
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.0,<2.0"
          maturin develop --release
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # D-13: maturin backend needs Rust to smoke-compile the extension
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.0,<2.0"
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Phase 2: hard-skip tag→PyPI publish (D-09, D-15).
  release:
    name: Release
    runs-on: ubuntu-latest
    # Re-enable in Phase 5 with multi-OS wheel matrix + clean-env install→pytest (PACK-01..03).
    if: false
    needs: build
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
