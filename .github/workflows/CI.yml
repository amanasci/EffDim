name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # D-16: drop 3.9 — align with requires-python >=3.10 and abi3-py310
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # D-15: Rust Inventory A/B geometry + compute_dim mirrors before maturin/pytest
      - name: Cargo test effdim-core
        run: cargo test -p effdim-core
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # D-11: keep maturin develop + pytest matrix for PR feedback
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.0,<2.0"
          maturin develop --release
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest

  # PACK-01 / PACK-03 / D-09..D-12 / D-14 / D-15: multi-OS maturin wheels (native runner arches)
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # D-10: one build Python per OS; abi3-py310 covers >=3.10
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # D-15: wheels only — do not request an sdist artifact
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # PACK-02 / D-11: clean-env pip install of wheel → full pytest
  test-wheel:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist
      - name: Clean env install + pytest
        shell: bash
        run: |
          python -m venv .venv-wheel
          if [ -x .venv-wheel/Scripts/python ]; then
            PY=.venv-wheel/Scripts/python
          else
            PY=.venv-wheel/bin/python
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl pytest
          "$PY" -m pytest

  # D-13: verify-only — tag→PyPI remains hard-disabled until a later publish decision
  release:
    name: Release
    runs-on: ubuntu-latest
    if: false
    needs: test-wheel
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
