# The 31-encoder manifest for the encoder-scaling sweep.
#
# Loaded by sweep.manifest.load_manifest(). Rows are the Platonic Universe
# `physics` benchmark embeddings, HF dataset UniverseTBD/pu-embeddings, pinned
# to the snapshot below. `name` -> checkpoint mapping and per-checkpoint
# parameter counts were taken from the model that generated each PU config,
# per UniverseTBD/platonic-universe's src/pu/experiments_layerwise.py MODEL_MAP
# (https://github.com/UniverseTBD/platonic-universe/blob/main/src/pu/experiments_layerwise.py).
#
# `params` = total parameter count of the checkpoint that produced the
# embedding, as reported by the checkpoint's own HF `safetensors` metadata
# (https://huggingface.co/api/models/<repo>) where available, or computed
# directly from the checkpoint's published weights file where no safetensors
# conversion exists (noted per-entry below). For the two vision-language
# families (llava_15, paligemma) the PU adapter (src/pu/models/hf.py
# VLMAdapter.embed_for_mode) runs the FULL multimodal model and takes the
# last language-model hidden state (mean-pooled), not the vision tower alone
# -- confirmed by the embedding dims below matching each checkpoint's LLM
# hidden_size, not its CLIP/SigLIP vision width. `params` for those two
# families is therefore the checkpoint TOTAL (vision + language), not a
# vision-tower-only count.
repo: UniverseTBD/pu-embeddings
snapshot: bc081f8a5db4767edcd958653d96efde9137de0b
n_rows: 86471
label_table: /mnt/ssd-cluster/effdim/labels_Smith42_galaxies_v2.0_test.parquet

encoders:
  # AstroPT (Smith42/astroPT_v2.0, one repo holding all 3 sizes as
  # astropt/{015M,095M,850M}/ckpt.pt). params from each size's own
  # hparams.txt self-reported name (e.g. "AstroPT-0014.6M"), rounded to the
  # figure the checkpoint names itself.
  - name: astropt_015M
    family: AstroPT
    dim: 384
    params: 14600000
    params_source: https://huggingface.co/Smith42/astroPT_v2.0/blob/main/astropt/015M/hparams.txt
    in_paper: false
  - name: astropt_095M
    family: AstroPT
    dim: 768
    params: 95200000
    params_source: https://huggingface.co/Smith42/astroPT_v2.0/blob/main/astropt/095M/hparams.txt
    in_paper: false
  - name: astropt_850M
    family: AstroPT
    dim: 2048
    params: 853600000
    params_source: https://huggingface.co/Smith42/astroPT_v2.0/blob/main/astropt/850M/hparams.txt
    in_paper: false

  # CLIP (openai/clip-vit-*). PU's HFAdapter.embed_for_mode calls
  # model.get_image_features(), which only runs vision_model + visual_projection
  # -- the text tower never runs. `params` below is therefore vision tower +
  # visual projection only, summed from checkpoint tensors (tensor names
  # starting with `vision_model.` / `visual_projection.`), not the checkpoint
  # total.
  - name: clip_base
    family: CLIP
    dim: 512
    # No safetensors conversion exists for openai/clip-vit-base-patch16; this
    # is the exact vision-tower + visual-projection count computed from the
    # checkpoint's own pytorch_model.bin state dict (loaded with torch and
    # summed over keys starting with `vision_model.`/`visual_projection.`),
    # not a card figure.
    params: 86192837
    params_source: https://huggingface.co/openai/clip-vit-base-patch16/blob/main/pytorch_model.bin
    in_paper: true
  - name: clip_large
    family: CLIP
    dim: 768
    # vision tower + visual projection, summed from checkpoint tensors (read
    # via the model.safetensors header's per-tensor shapes; no safetensors
    # metadata separates the two towers, so this is not the API's reported
    # `total`).
    params: 303966465
    params_source: https://huggingface.co/openai/clip-vit-large-patch14
    in_paper: false

