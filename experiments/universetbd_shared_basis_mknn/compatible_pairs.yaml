# Compatible UniverseTBD / Platonic-Universe embedding pairs.
# Paths relative to PLATONIC_ROOT. Same row index = same object.
#
# kinds:
#   cross_model   — two encoders, same survey/objects
#   cross_survey  — same encoder, two imaging surveys (HSC↔JWST/DESI/Legacy)

# ---------------------------------------------------------------------------
# Physics galaxies (Smith42/galaxies) — n≈86k, separate files per model
# ---------------------------------------------------------------------------
physics_vit_dino:
  kind: cross_model
  survey: physics
  parquet1: data_hf/physics/vit_base_test.parquet
  col1: vit_base_galaxies
  parquet2: data_hf/physics/dinov3_vitb16_test.parquet
  col2: dinov3_vitb16_galaxies
  default_max_n: 16384

