[package]
name = "effdim-core"
version = "0.1.1"
edition = "2021"

[lib]
name = "effdim_core"
crate-type = ["rlib"]

[dependencies]
ndarray = { version = "0.17", features = ["blas"] }
faer = "0.24"
rand = "0.8"
openblas-src = { version = "0.10.16", default-features = false, features = ["cblas", "rustls"] }
rayon = "1.12.0"

[dev-dependencies]
approx = "0.5.1"
